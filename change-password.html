<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script>
        if (window.location.hash) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/logo/logo-uni.svg" type="image/svg+xml">
    <title>修改密碼 - 彰特空間預約</title>
    <meta name="description" content="設定高強度的新密碼，確保您的個人資料安全。">

    <link rel="stylesheet" href="css/all.css">
</head>
<body>
    <a href="#goCenter" class="sr-only focusable" accesskey="C" title="跳過導覽列，進入主要內容區">主要內容區</a>
    <a href="#headerNav" class="sr-only focusable" accesskey="U" title="跳至上方導覽列" tabindex="-1">上方導覽列</a>

    <div id="header" data-layout="layout/header_StaffLogged.html"></div>

    <main id="goCenter" tabindex="-1">
        <!-- 內頁 Banner -->
        <section class="page-banner">
            <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
                <defs>
                    <linearGradient id="bannerArcGradient" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="15.87%" stop-color="#084DC7" stop-opacity=".58"/>
                        <stop offset="62.02%" stop-color="#DDE9FC"/>
                    </linearGradient>
                    <clipPath id="bannerDotsClip" clipPathUnits="objectBoundingBox">
                        <path d="M0,0.05 C0.25,0.75 0.75,0.75 1,0.05 L1,1 L0,1 Z" />
                    </clipPath>
                </defs>
            </svg>
            <svg class="page-banner-arc" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <path class="page-banner-arc-mask" d="M0,0.05 C0.25,0.75 0.75,0.75 1,0.05 L1,1 L0,1 Z"/>
                <path d="M0,0.05 C0.25,0.75 0.75,0.75 1,0.05" fill="none" stroke="url(#bannerArcGradient)" stroke-width="1" stroke-dasharray="6 6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
            </svg>
            <img class="page-banner-mountain" src="img/dec/內頁背景banner素材/Subtract.svg" alt="">

            <div class="container page-banner-content">
                <nav class="page-banner-breadcrumb" aria-label="麵包屑導覽">
                    <ol>
                        <li>
                            <a class="breadcrumb-home" href="index.html" aria-label="首頁">
                                <i class="bi bi-house-door" aria-hidden="true"></i>
                            </a>
                        </li>
                        <li aria-current="page">修改密碼</li>
                    </ol>
                </nav>

                <div class="page-banner-main flex-row-between">
                    <div class="page-banner-text">
                        <h1 class="page-banner-title">修改密碼</h1>
                        <p class="page-banner-desc">請設定高強度的密碼，以確保您的個人資料安全。</p>
                    </div>
                    <div class="page-banner-visual" aria-hidden="true">
                        <img src="img/dec/內頁背景banner素材/人物組圖.png" alt="">
                    </div>
                </div>
            </div>
        </section>

        <!-- 修改密碼表單 -->
        <section class="cardFloating-section">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <div class="cardFloating">
                            <form id="changePasswordForm" novalidate>
                                <div class="auth-form-group">
                                    <label for="oldPassword">舊密碼<span class="tagPill tag-dangerFill tagPill-sm">必填</span></label>
                                    <div class="auth-form-password-field">
                                        <input type="password" id="oldPassword" name="oldPassword" class="form-control" autocomplete="current-password" placeholder="請輸入目前使用密碼">
                                        <button type="button" class="auth-form-password-toggle" data-password-toggle="oldPassword" aria-pressed="false" aria-label="顯示密碼">
                                            <i class="bi bi-eye" aria-hidden="true"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="auth-form-group">
                                    <label for="newPassword">新密碼<span class="tagPill tag-dangerFill tagPill-sm">必填</span></label>
                                    <div class="auth-form-password-field">
                                        <input type="password" id="newPassword" name="newPassword" class="form-control" autocomplete="new-password" placeholder="請輸入新密碼(需區分大小寫)" aria-describedby="newPasswordHint">
                                        <button type="button" class="auth-form-password-toggle" data-password-toggle="newPassword" aria-pressed="false" aria-label="顯示密碼">
                                            <i class="bi bi-eye" aria-hidden="true"></i>
                                        </button>
                                    </div>
                                    <p class="auth-form-hint" id="newPasswordHint">密碼需 6 至 12 碼大小寫英文字母、數字或半形特殊符號。</p>
                                </div>

                                <div class="auth-form-group">
                                    <label for="confirmPassword">新密碼確認<span class="tagPill tag-dangerFill tagPill-sm">必填</span></label>
                                    <div class="auth-form-password-field">
                                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" autocomplete="new-password" placeholder="請再次輸入新密碼(需區分大小寫)" aria-describedby="confirmPasswordError">
                                        <button type="button" class="auth-form-password-toggle" data-password-toggle="confirmPassword" aria-pressed="false" aria-label="顯示密碼">
                                            <i class="bi bi-eye" aria-hidden="true"></i>
                                        </button>
                                    </div>
                                    <p class="auth-form-error" id="confirmPasswordError" hidden>兩次輸入的新密碼不一致，請重新確認。</p>
                                </div>

                                <div class="flex-center-center">
                                    <button type="submit" class="btnRounded btn-primary">
                                        立即更新<i class="bi bi-arrow-right" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 回到頂部 -->
    <button type="button" class="scroll-top-btn" aria-label="回到頁面頂端">
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
        <span class="scroll-top-text">回頂端</span>
    </button>

    <div id="footer" data-layout="layout/footer.html"></div>

    <script src="js/vendor/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/changePassword.js"></script>
</body>
</html>
